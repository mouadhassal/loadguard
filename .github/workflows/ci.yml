name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Protocol, safety, resilience, billing, properties, mutants
        run: python -m pytest -q -m "not ui and not slow"
      - name: Browser end-to-end (Playwright)
        env:
          LOADGUARD_BROWSER: chromium
        run: python -m pytest -q -m ui
      - name: Load test smoke (50 stations)
        run: python bench/load_test.py 50
